services:
  postgres:
    image: postgres:17-alpine
    container_name: xenix-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: xenix
      POSTGRES_PASSWORD: xenix_dev_password
      POSTGRES_DB: xenix
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
