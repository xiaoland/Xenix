name: Native CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-contract:
    name: Promotion Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require same-repository develop to main
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REF" = "develop"
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$BASE_REF" = "main"

  test-plan:
    name: Test Topology
    needs: promotion-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.matrix.outputs.shards }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install the manifest parser dependency
        shell: bash
        run: |
          PYDANTIC_VERSION="$(python3 -c 'import tomllib; packages = tomllib.load(open("pdm.lock", "rb"))["package"]; print(next(item["version"] for item in packages if item["name"] == "pydantic"))')"
          python3 -m pip install --disable-pip-version-check "pydantic==$PYDANTIC_VERSION"
      - name: Read semantic shards from the authoritative manifest
        id: matrix
        shell: bash
        run: echo "shards=$(python3 scripts/test_suites.py matrix)" >> "$GITHUB_OUTPUT"

  test:
    name: Python ${{ matrix.python }} / ${{ matrix.shard.name }}
    needs: [promotion-contract, test-plan]
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10", "3.13.14", "3.14.6"]
        shard: ${{ fromJSON(needs.test-plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pdm==2.26.6
      - run: pdm install --frozen-lockfile -G :all
      - name: Run lint, type checks, and preflights
        if: matrix.shard.run_check
        run: pdm run check
      - name: Run semantic test shard
        run: >-
          pdm run test
          --promotion-shard "${{ matrix.shard.name }}"
          --junitxml "pytest-${{ matrix.python }}-${{ matrix.shard.name }}.xml"
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-${{ matrix.python }}-${{ matrix.shard.name }}
          path: pytest-${{ matrix.python }}-${{ matrix.shard.name }}*.xml
          if-no-files-found: warn
          retention-days: 14

  gate:
    name: Native CI Gate
    if: always()
    needs: [promotion-contract, test-plan, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every promotion check
        shell: bash
        env:
          CONTRACT_RESULT: ${{ needs.promotion-contract.result }}
          PLAN_RESULT: ${{ needs.test-plan.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          test "$PLAN_RESULT" = "success"
          test "$TEST_RESULT" = "success"
