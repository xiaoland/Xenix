name: Native CI

on:
  pull_request:
    paths-ignore: ["website/**"]
  push:
    branches: [main]
    paths-ignore: ["website/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10", "3.13.14", "3.14.6"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pdm==2.26.6
      - run: pdm install --frozen-lockfile -G :all
      - run: pdm run check
      - run: pdm run test
