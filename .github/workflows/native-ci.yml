name: Native CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  promotion-contract:
    name: Promotion Contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require same-repository develop to main
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test "$HEAD_REF" = "develop"
          test "$HEAD_REPOSITORY" = "$REPOSITORY"
          test "$BASE_REF" = "main"

  test:
    name: Python ${{ matrix.python }}
    needs: promotion-contract
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10", "3.13.14", "3.14.6"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pdm==2.26.6
      - run: pdm install --frozen-lockfile -G :all
      - run: pdm run check
      - run: pdm run test

  gate:
    name: Native CI Gate
    if: always()
    needs: [promotion-contract, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every promotion check
        shell: bash
        env:
          CONTRACT_RESULT: ${{ needs.promotion-contract.result }}
          TEST_RESULT: ${{ needs.test.result }}
        run: |
          test "$CONTRACT_RESULT" = "success"
          test "$TEST_RESULT" = "success"
