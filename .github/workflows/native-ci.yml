name: Native CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-ci:
    name: Native CI
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.2"
      - run: python -m pip install pdm==2.26.6
      - name: Install locked dependencies
        run: pdm install --frozen-lockfile -G :all
      - name: Run static checks and preflights
        run: pdm run check
      - name: Run high-value acceptance portfolio
        run: pdm run test -vv --junitxml pytest.xml
      - name: Capture deterministic UI scenarios
        # Registry-driven batch: every admitted scenario is captured once, each
        # gets an independent result, failures are aggregated into a non-zero
        # exit code, and the batch verifies expected vs captured scenario sets.
        run: pdm run ui-capture-all --output ui-artifacts
      - name: Run Windows native UI smoke
        run: pdm run ui-native-smoke
      - name: Build UI artifact index
        if: always()
        run: python -m scripts.ui_lab.artifact_index --root ui-artifacts
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest
          path: pytest.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Preserve UI evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-artifacts
          path: ui-artifacts
          if-no-files-found: warn
          retention-days: 14
