name: Native CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  native-ci:
    name: Native CI
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.2"
      - run: python -m pip install pdm==2.26.6
      - name: Install locked dependencies
        run: pdm install --frozen-lockfile -G :all
      - name: Run static checks and preflights
        run: pdm run check
      - name: Run high-value acceptance portfolio
        run: pdm run test -vv --junitxml pytest.xml
      - name: Preserve test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest
          path: pytest.xml
          if-no-files-found: warn
          retention-days: 14
