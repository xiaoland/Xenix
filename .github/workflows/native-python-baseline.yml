name: Native Python Baseline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-smoke:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12.10", "3.13.14", "3.14.6"]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install pdm==2.26.6
      - run: pdm install --frozen-lockfile -G :all
      - run: dotnet tool restore
      - name: Full package and smoke comparison
        shell: pwsh
        env:
          XENIX_RELEASE_BUILD: "1"
          XENIX_TRIAL_LLM_BASE_URL: "https://trial.example.invalid/v1"
          XENIX_TRIAL_LLM_API_KEY: "non-production-baseline-key"
          XENIX_TRIAL_LLM_MODEL: "non-production-baseline-model"
          XENIX_TRIAL_LOCK_DAYS: "14"
          XENIX_TRIAL_LOCK_STATE_SECRET: "non-production-baseline-stable-secret"
          XENIX_TRIAL_PURCHASE_URL: "https://example.invalid/purchase"
        run: |
          $elapsed = Measure-Command { pdm run release-build }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifest = Get-Content dist/release-manifest.json -Raw | ConvertFrom-Json
          $manifest | Add-Member package_seconds ([math]::Round($elapsed.TotalSeconds, 2))
          $manifest | ConvertTo-Json -Depth 8 | Set-Content "dist/python-${{ matrix.python }}-baseline.json" -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-${{ matrix.python }}-baseline
          path: dist/python-${{ matrix.python }}-baseline.json
          retention-days: 7
