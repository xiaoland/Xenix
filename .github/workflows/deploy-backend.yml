name: Deploy Backend to Aliyun FC

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/backend/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/check-layer-hash-backend.sh"
      - ".github/scripts/prune-layer-versions.sh"
  workflow_dispatch:

permissions:
  contents: write

env:
  LAYER_NAME: xenix-backend-nodejs-deps
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"
  # Aliyun credentials
  ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}
  ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
  ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
  # Application environment variables
  OSS_REGION: ${{ vars.OSS_REGION }}
  OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
  OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Serverless Devs CLI
        run: npm install -g @serverless-devs/s

      - name: Configure Serverless Devs credentials
        run: |
          s config add \
            --AccountID "$ALIYUN_ACCOUNT_ID" \
            --AccessKeyID "$ALIYUN_ACCESS_KEY_ID" \
            --AccessKeySecret "$ALIYUN_ACCESS_KEY_SECRET" \
            -a default -f

      - name: Prepare dependencies for Serverless Devs build
        run: bash .github/workflow/build-layer-backend.sh

      - name: Build and publish backend layer
        id: publish-layer
        run: |
          cd packages/backend
          echo "Building and publishing backend layer using Serverless Devs..."
          set +e
          LAYER_OUTPUT=$(s build --publish-layer --layer-name "$LAYER_NAME" --region "$OSS_REGION" --output json 2>&1)
          LAYER_EXIT_CODE=$?
          set -e
          echo "Exit code: $LAYER_EXIT_CODE"
          echo "$LAYER_OUTPUT"
          if [ $LAYER_EXIT_CODE -ne 0 ]; then
            echo "ERROR: Layer build and publish failed with exit code $LAYER_EXIT_CODE"
            exit $LAYER_EXIT_CODE
          fi
          # Extract version number from output (prefer JSON, fallback to text)
          NEW_VERSION=""
          if echo "$LAYER_OUTPUT" | jq -e . >/dev/null 2>&1; then
            NEW_VERSION=$(echo "$LAYER_OUTPUT" | jq -r '.. | .version? // empty' | tail -1)
          fi
          if [ -z "$NEW_VERSION" ]; then
            NEW_VERSION=$(echo "$LAYER_OUTPUT" | grep -oP 'version:\s*\K[0-9]+' | tail -1)
          fi
          if [ -z "$NEW_VERSION" ]; then
            NEW_VERSION=$(echo "$LAYER_OUTPUT" | grep -oE 'versions/[0-9]+' | tail -1 | cut -d'/' -f2)
          fi
          if [ -z "$NEW_VERSION" ]; then
            echo "ERROR: Unable to determine new layer version from build output"
            exit 1
          fi
          echo "New layer version: $NEW_VERSION"
          echo "NEW_LAYER_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Restore original package.json after layer build
        run: |
          cd packages/backend
          if [ -f package.json.original ]; then
            mv package.json.original package.json
            rm -f package.json.build
          fi

      - name: Update layer version in packages/backend/s.yaml
        if: steps.publish-layer.outputs.NEW_LAYER_VERSION != ''
        run: |
          NEW_VERSION=${{ steps.publish-layer.outputs.NEW_LAYER_VERSION }}
          echo "Updating packages/backend/s.yaml with layer version: $NEW_VERSION"
          # Update the layer ARN in packages/backend/s.yaml
          sed -i "s|layers/xenix-backend-nodejs-deps/versions/[0-9]*|layers/xenix-backend-nodejs-deps/versions/$NEW_VERSION|g" packages/backend/s.yaml
          # Show the change
          grep "nodejsDepsLayerArn" packages/backend/s.yaml

      - name: Commit layer version update
        if: steps.publish-layer.outputs.NEW_LAYER_VERSION != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/backend/s.yaml
          git diff --cached --quiet || (git commit -m "chore: update backend layer version to ${{ steps.publish-layer.outputs.NEW_LAYER_VERSION }}" && git push)

      - name: Prune old layer versions
        run: bash .github/scripts/prune-layer-versions.sh "$LAYER_NAME" 3 "$OSS_REGION"

      - name: Build backend
        run: pnpm --filter @xenix/backend run build

      - name: Prepare minimal backend deploy artifact
        run: |
          set -euo pipefail
          DEPLOY_DIR="packages/backend/.fc-deploy"
          rm -rf "$DEPLOY_DIR"
          mkdir -p "$DEPLOY_DIR"

          cp -R packages/backend/dist "$DEPLOY_DIR/dist"
          cp packages/backend/fc-start.sh "$DEPLOY_DIR/fc-start.sh"
          cp packages/backend/s.yaml "$DEPLOY_DIR/s.yaml"

          echo "Deploy artifact contents:"
          find "$DEPLOY_DIR" -maxdepth 3 -type f | sort

      - name: Make fc-start.sh executable
        run: chmod +x packages/backend/.fc-deploy/fc-start.sh

      - name: Deploy backend function
        run: |
          cd packages/backend/.fc-deploy
          s deploy xenix-backend -y --use-local

      - name: Deployment summary
        run: echo "✅ Backend layer and function deployed successfully!"
