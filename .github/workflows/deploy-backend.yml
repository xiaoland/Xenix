name: Deploy Backend to Aliyun FC

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/backend/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/check-layer-hash-backend.sh"
      - ".github/scripts/prune-layer-versions.sh"
  workflow_dispatch:
    inputs:
      force_layer_publish:
        description: "Force rebuild & publish backend layer"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write

env:
  LAYER_NAME: xenix-backend-nodejs-deps
  NODE_ENV: development
  NPM_CONFIG_PRODUCTION: "false"
  # Aliyun credentials
  ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}
  ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
  ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
  # Application environment variables
  OSS_REGION: ${{ vars.OSS_REGION }}
  OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
  OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.28.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Serverless Devs CLI
        run: npm install -g @serverless-devs/s

      - name: Configure Serverless Devs credentials
        run: |
          s config add \
            --AccountID "$ALIYUN_ACCOUNT_ID" \
            --AccessKeyID "$ALIYUN_ACCESS_KEY_ID" \
            --AccessKeySecret "$ALIYUN_ACCESS_KEY_SECRET" \
            -a default -f

      - name: Restore layer hash cache
        uses: actions/cache@v4
        with:
          path: packages/backend/.layer-hash-backend
          key: layer-hash-backend-${{ hashFiles('packages/backend/package.json') }}
          restore-keys: |
            layer-hash-backend-

      - name: Check if layer dependencies changed
        id: check-layer
        run: bash .github/scripts/check-layer-hash-backend.sh

      - name: Build and publish backend layer (conditional)
        if: steps.check-layer.outputs.LAYER_CHANGED == 'true' || inputs.force_layer_publish == 'true'
        id: publish-layer
        run: |
          echo "Building backend layer..."
          bash .github/workflow/build-layer-backend.sh
          echo "Publishing layer..."
          set +e
          pushd packages/backend >/dev/null
          echo "Layer publish working dir: $PWD"
          echo "Layer code dir contents:"
          ls -la "$PWD/layer" || true
          CODE_PATH="$PWD/layer"
          if [ ! -d "$CODE_PATH" ]; then
            echo "ERROR: Layer code directory not found: $CODE_PATH"
            exit 1
          fi
          LAYER_OUTPUT=$(s layer publish --layer-name "$LAYER_NAME" --code "$CODE_PATH" --compatible-runtime nodejs22,custom.debian12 --region "$OSS_REGION" 2>&1)
          popd >/dev/null
          LAYER_EXIT_CODE=$?
          set -e
          echo "Exit code: $LAYER_EXIT_CODE"
          echo "$LAYER_OUTPUT"
          if [ $LAYER_EXIT_CODE -ne 0 ]; then
            echo "ERROR: Layer publish failed with exit code $LAYER_EXIT_CODE"
            exit $LAYER_EXIT_CODE
          fi
          # Extract version number from output
          NEW_VERSION=$(echo "$LAYER_OUTPUT" | grep -oP 'version:\s*\K[0-9]+' | tail -1)
          if [ -z "$NEW_VERSION" ]; then
            # Try alternative pattern
            NEW_VERSION=$(echo "$LAYER_OUTPUT" | grep -oE 'versions/[0-9]+' | tail -1 | cut -d'/' -f2)
          fi
          echo "New layer version: $NEW_VERSION"
          echo "NEW_LAYER_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update layer version in packages/backend/s.yaml
        if: steps.publish-layer.outputs.NEW_LAYER_VERSION != ''
        run: |
          NEW_VERSION=${{ steps.publish-layer.outputs.NEW_LAYER_VERSION }}
          echo "Updating packages/backend/s.yaml with layer version: $NEW_VERSION"
          # Update the layer ARN in packages/backend/s.yaml
          sed -i "s|layers/xenix-backend-nodejs-deps/versions/[0-9]*|layers/xenix-backend-nodejs-deps/versions/$NEW_VERSION|g" packages/backend/s.yaml
          # Show the change
          grep "nodejsDepsLayerArn" packages/backend/s.yaml

      - name: Commit layer version update
        if: steps.publish-layer.outputs.NEW_LAYER_VERSION != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add packages/backend/s.yaml
          git diff --cached --quiet || (git commit -m "chore: update backend layer version to ${{ steps.publish-layer.outputs.NEW_LAYER_VERSION }}" && git push)

      - name: Prune old layer versions
        if: steps.publish-layer.outputs.NEW_LAYER_VERSION != ''
        run: bash .github/scripts/prune-layer-versions.sh "$LAYER_NAME" 3

      - name: Build backend
        run: pnpm --filter @xenix/backend run build

      - name: Make fc-start.sh executable
        run: chmod +x packages/backend/fc-start.sh

      - name: Deploy backend function
        run: s deploy xenix-backend -y -t packages/backend/s.yaml --use-local

      - name: Deployment summary
        run: |
          if [ "${{ steps.publish-layer.outputs.NEW_LAYER_VERSION }}" != "" ]; then
            echo "✅ Backend layer and function deployed successfully!"
          else
            echo "✅ Backend function deployed successfully (layer unchanged)!"
          fi
