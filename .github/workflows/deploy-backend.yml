name: Deploy Backend to Aliyun FC

on:
  push:
    branches:
      - main
      - master
    paths:
      - "packages/backend/**"
      - "packages/shared/**"
      - ".github/workflows/deploy-backend.yml"
      - ".github/scripts/check-layer-hash-backend.sh"
      - ".github/scripts/prune-layer-versions.sh"
  workflow_dispatch:

permissions:
  contents: write

env:
  LAYER_NAME: xenix-backend-nodejs-deps
  # Aliyun credentials
  ALIYUN_ACCOUNT_ID: ${{ secrets.ALIYUN_ACCOUNT_ID }}
  ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
  ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
  # Application environment variables
  OSS_REGION: ${{ vars.OSS_REGION }}
  OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
  OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
  OSS_BUCKET: ${{ vars.OSS_BUCKET }}
  OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Install Serverless Devs CLI
        run: npm install -g @serverless-devs/s

      - name: Configure Serverless Devs credentials
        run: |
          s config add \
            --AccountID "$ALIYUN_ACCOUNT_ID" \
            --AccessKeyID "$ALIYUN_ACCESS_KEY_ID" \
            --AccessKeySecret "$ALIYUN_ACCESS_KEY_SECRET" \
            -a default -f

      - name: Restore layer hash cache
        uses: actions/cache@v4
        with:
          path: packages/backend/.layer-hash-backend
          key: layer-hash-backend-${{ hashFiles('packages/backend/package.json') }}
          restore-keys: |
            layer-hash-backend-

      - name: Check if layer dependencies changed
        id: check-layer
        run: bash ../../.github/scripts/check-layer-hash-backend.sh

      - name: Build and publish backend layer (conditional)
        if: steps.check-layer.outputs.LAYER_CHANGED == 'true'
        id: publish-layer
        run: |
          echo "Building backend layer..."
          bash build-layer.sh
          echo "Publishing layer..."
          LAYER_OUTPUT=$(s layer publish --layer-name "$LAYER_NAME" --code ./opt --compatible-runtime nodejs22,custom.debian12 2>&1)
          echo "$LAYER_OUTPUT"
          # Extract version number from output
          NEW_VERSION=$(echo "$LAYER_OUTPUT" | grep -oP 'version:\s*\K[0-9]+' | tail -1)
          if [ -z "$NEW_VERSION" ]; then
            # Try alternative pattern
            NEW_VERSION=$(echo "$LAYER_OUTPUT" | grep -oE 'versions/[0-9]+' | tail -1 | cut -d'/' -f2)
          fi
          echo "New layer version: $NEW_VERSION"
          echo "LAYER_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update layer version in s.yaml
        if: steps.check-layer.outputs.LAYER_CHANGED == 'true' && steps.publish-layer.outputs.LAYER_VERSION != ''
        run: |
          NEW_VERSION=${{ steps.publish-layer.outputs.LAYER_VERSION }}
          echo "Updating s.yaml with layer version: $NEW_VERSION"
          # Update the layer ARN in s.yaml
          sed -i "s|layers/xenix-backend-nodejs-deps/versions/[0-9]*|layers/xenix-backend-nodejs-deps/versions/$NEW_VERSION|g" s.yaml
          # Show the change
          grep "nodejsDepsLayerArn" s.yaml

      - name: Commit layer version update
        if: steps.check-layer.outputs.LAYER_CHANGED == 'true' && steps.publish-layer.outputs.LAYER_VERSION != ''
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add s.yaml
          git diff --cached --quiet || (git commit -m "chore: update backend layer version to ${{ steps.publish-layer.outputs.LAYER_VERSION }}" && git push)

      - name: Prune old layer versions
        if: steps.check-layer.outputs.LAYER_CHANGED == 'true'
        run: bash ../../.github/scripts/prune-layer-versions.sh "$LAYER_NAME" 3

      - name: Build backend
        run: pnpm run build

      - name: Deploy backend function
        run: s deploy xenix-backend -y

      - name: Deployment summary
        run: |
          if [ "${{ steps.check-layer.outputs.LAYER_CHANGED }}" = "true" ]; then
            echo "✅ Backend layer and function deployed successfully!"
          else
            echo "✅ Backend function deployed successfully (layer unchanged)!"
          fi
