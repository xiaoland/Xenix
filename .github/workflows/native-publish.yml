name: Native Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate SemVer approved for publication
        required: true
      manifest_sha256:
        description: SHA-256 printed by the candidate workflow
        required: true

permissions:
  contents: read

concurrency:
  group: native-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    environment: native-publish
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
      - run: python -m pip install pdm==2.26.6
      - run: pdm install --frozen-lockfile -G release
      - name: Publish feed last
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
          RELEASES_OSS_PUBLIC_URL: ${{ vars.RELEASES_OSS_PUBLIC_URL }}
        run: pdm run python scripts/publish_oss_candidate.py --version "${{ inputs.version }}" --manifest-sha256 "${{ inputs.manifest_sha256 }}"
