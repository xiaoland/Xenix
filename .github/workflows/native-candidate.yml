name: Native Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2022
    environment: native-candidate
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14.6"
          cache: pip
      - run: python -m pip install pdm==2.26.6
      - run: pdm install --frozen-lockfile -G :all
      - run: dotnet tool restore
      - run: pdm run release-identity --require-tag
      - run: pdm run check
      - run: pdm run test
      - name: Build unsigned candidate
        shell: pwsh
        env:
          XENIX_RELEASE_BUILD: "1"
          XENIX_PUBLIC_RELEASE_BUILD: "1"
          XENIX_BUILD_COMMIT: ${{ github.sha }}
          RELEASES_OSS_PUBLIC_URL: ${{ vars.RELEASES_OSS_PUBLIC_URL }}
          XENIX_TRIAL_LLM_BASE_URL: ${{ vars.XENIX_TRIAL_LLM_BASE_URL }}
          XENIX_TRIAL_LLM_API_KEY: ${{ secrets.XENIX_TRIAL_LLM_API_KEY }}
          XENIX_TRIAL_LLM_MODEL: ${{ vars.XENIX_TRIAL_LLM_MODEL }}
          XENIX_TRIAL_LOCK_DAYS: ${{ vars.XENIX_TRIAL_LOCK_DAYS }}
          XENIX_TRIAL_LOCK_STATE_SECRET: ${{ secrets.XENIX_TRIAL_LOCK_STATE_SECRET }}
          XENIX_TRIAL_PURCHASE_URL: ${{ vars.XENIX_TRIAL_PURCHASE_URL }}
          XENIX_OTEL_EXPORT_TRACES: ${{ vars.XENIX_OTEL_EXPORT_TRACES }}
          XENIX_OTEL_EXPORT_METRICS: ${{ vars.XENIX_OTEL_EXPORT_METRICS }}
          XENIX_OTEL_EXPORT_LOGS: ${{ vars.XENIX_OTEL_EXPORT_LOGS }}
          OTEL_SDK_DISABLED: ${{ vars.OTEL_SDK_DISABLED }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
          OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_TRACES_PROTOCOL }}
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
          OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_METRICS_ENDPOINT }}
          OTEL_EXPORTER_OTLP_METRICS_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_METRICS_PROTOCOL }}
          OTEL_EXPORTER_OTLP_METRICS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_METRICS_HEADERS }}
          OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: ${{ vars.OTEL_EXPORTER_OTLP_LOGS_ENDPOINT }}
          OTEL_EXPORTER_OTLP_LOGS_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_LOGS_PROTOCOL }}
          OTEL_EXPORTER_OTLP_LOGS_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_LOGS_HEADERS }}
        run: pdm run release-candidate
      - name: Upload immutable candidate to OSS
        env:
          ALIYUN_ACCESS_KEY_ID: ${{ secrets.ALIYUN_ACCESS_KEY_ID }}
          ALIYUN_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: pdm run python scripts/upload_oss_candidate.py
