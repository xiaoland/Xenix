name: Website Deploy Preview

on:
  pull_request:
    paths:
      - "website/**"
      - ".github/workflows/website-*.yml"

concurrency:
  group: website-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    environment: preview
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.1

      - uses: actions/setup-node@v6
        with:
          node-version-file: website/.nvmrc
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check required preview variables
        run: |
          test -n "$XENIX_DOWNLOAD_URL"
          test -n "$XENIX_PAGES_PROJECT_NAME"
          test -n "$XENIX_D1_DATABASE_NAME"
          test -n "$XENIX_D1_DATABASE_ID"
          test -n "$CLOUDFLARE_WORKERS_SUBDOMAIN"
        env:
          XENIX_DOWNLOAD_URL: ${{ vars.XENIX_DOWNLOAD_URL }}
          XENIX_PAGES_PROJECT_NAME: ${{ vars.XENIX_PAGES_PROJECT_NAME }}
          XENIX_D1_DATABASE_NAME: ${{ vars.XENIX_D1_DATABASE_NAME }}
          XENIX_D1_DATABASE_ID: ${{ vars.XENIX_D1_DATABASE_ID }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}

      - run: pnpm run deploy:worker:preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          XENIX_DOWNLOAD_URL: ${{ vars.XENIX_DOWNLOAD_URL }}
          XENIX_D1_DATABASE_NAME: ${{ vars.XENIX_D1_DATABASE_NAME }}
          XENIX_D1_DATABASE_ID: ${{ vars.XENIX_D1_DATABASE_ID }}
          XENIX_PREVIEW_WORKER_PREFIX: ${{ vars.XENIX_PREVIEW_WORKER_PREFIX }}

      - run: pnpm run build && pnpm run verify:dist
        env:
          VITE_API_ORIGIN: ${{ env.VITE_API_ORIGIN }}
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}

      - run: pnpm exec wrangler pages deploy dist --project-name "$XENIX_PAGES_PROJECT_NAME" --branch "${{ github.head_ref }}"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          XENIX_PAGES_PROJECT_NAME: ${{ vars.XENIX_PAGES_PROJECT_NAME }}
