[pytest]
# Pytest configuration for ml-backend integration tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -s

# Markers
markers =
    integration: Integration tests for all models
    regression: Regression model tests
    classification: Classification model tests
    slow: Slow running tests (batch training)

# Minimum Python version
minversion = 3.10
