edition: 3.0.0
name: xenix-ml-backend
access: default

vars:
  region: cn-hangzhou

resources:
  # Python Layer - ML dependencies (pandas, scikit-learn, xgboost, etc.)
  xenix-ml-python-layer:
    component: fc3
    props:
      region: ${vars.region}
      layerName: xenix-ml-python-deps
      code: ./python-layer
      description: Python ML dependencies for Xenix
      compatibleRuntime:
        - python3.10
        - custom.debian10

  # ML Auto-tune Worker Function
  ml-auto-tune-worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ml-auto-tune-worker
      description: ML auto-tuning worker (GridSearchCV)
      runtime: python3.10
      handler: index.handler
      memorySize: 4096
      timeout: 600 # 10 minutes
      code: ./fc-workers/auto-tune
      layers:
        - ${resources.xenix-ml-python-layer.output.arn}
      environmentVariables:
        PYTHONPATH: /opt/python
        DATABASE_URL: ${env.DATABASE_URL}
        PYTHON_EXECUTABLE: python3
      nasConfig:
        userId: 10003
        groupId: 10003
        mountPoints:
          - serverAddr: ${env.OSS_NAS_SERVER_ADDR}
            nasDir: /xenix-oss
            fcDir: /mnt/oss

  # ML Manual-tune Worker Function
  ml-manual-tune-worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ml-manual-tune-worker
      description: ML manual-tuning worker (specific parameters)
      runtime: python3.10
      handler: index.handler
      memorySize: 4096
      timeout: 600
      code: ./fc-workers/manual-tune
      layers:
        - ${resources.xenix-ml-python-layer.output.arn}
      environmentVariables:
        PYTHONPATH: /opt/python
        DATABASE_URL: ${env.DATABASE_URL}
        PYTHON_EXECUTABLE: python3
      nasConfig:
        userId: 10003
        groupId: 10003
        mountPoints:
          - serverAddr: ${env.OSS_NAS_SERVER_ADDR}
            nasDir: /xenix-oss
            fcDir: /mnt/oss

  # ML Predict Worker Function
  ml-predict-worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ml-predict-worker
      description: ML prediction worker
      runtime: python3.10
      handler: index.handler
      memorySize: 4096
      timeout: 600
      code: ./fc-workers/predict
      layers:
        - ${resources.xenix-ml-python-layer.output.arn}
      environmentVariables:
        PYTHONPATH: /opt/python
        DATABASE_URL: ${env.DATABASE_URL}
        PYTHON_EXECUTABLE: python3
      nasConfig:
        userId: 10003
        groupId: 10003
        mountPoints:
          - serverAddr: ${env.OSS_NAS_SERVER_ADDR}
            nasDir: /xenix-oss
            fcDir: /mnt/oss
