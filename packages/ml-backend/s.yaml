edition: 3.0.0
name: xenix-ml-backend
access: default

vars:
  region: cn-hangzhou

resources:
  xenix-ml-python-layer:
    component: fc3
    props:
      region: ${vars.region}
      layerName: xenix-ml-python-deps
      code: ./python-layer
      description: Python ML dependencies
      compatibleRuntime: [python3.10, custom.debian10]

  ml-batch-train-worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ml-batch-train-worker
      description: Batch training with GridSearchCV
      runtime: python3.10
      handler: index.handler
      memorySize: 4096
      timeout: 600
      code: ./fc-workers/batch-train
      layers: [${resources.xenix-ml-python-layer.output.arn}]
      environmentVariables:
        PYTHONPATH: /opt/python
        DATABASE_URL: ${env.DATABASE_URL}
      nasConfig:
        userId: 10003
        groupId: 10003
        mountPoints:
          - serverAddr: ${env.OSS_NAS_SERVER_ADDR}
            nasDir: /xenix-oss
            fcDir: /mnt/oss

  ml-single-train-worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ml-single-train-worker
      description: Single training with specific parameters
      runtime: python3.10
      handler: index.handler
      memorySize: 4096
      timeout: 600
      code: ./fc-workers/single-train
      layers: [${resources.xenix-ml-python-layer.output.arn}]
      environmentVariables:
        PYTHONPATH: /opt/python
        DATABASE_URL: ${env.DATABASE_URL}
      nasConfig:
        userId: 10003
        groupId: 10003
        mountPoints:
          - serverAddr: ${env.OSS_NAS_SERVER_ADDR}
            nasDir: /xenix-oss
            fcDir: /mnt/oss

  ml-predict-worker:
    component: fc3
    props:
      region: ${vars.region}
      functionName: ml-predict-worker
      description: ML prediction worker
      runtime: python3.10
      handler: index.handler
      memorySize: 4096
      timeout: 600
      code: ./fc-workers/predict
      layers: [${resources.xenix-ml-python-layer.output.arn}]
      environmentVariables:
        PYTHONPATH: /opt/python
        DATABASE_URL: ${env.DATABASE_URL}
      nasConfig:
        userId: 10003
        groupId: 10003
        mountPoints:
          - serverAddr: ${env.OSS_NAS_SERVER_ADDR}
            nasDir: /xenix-oss
            fcDir: /mnt/oss
