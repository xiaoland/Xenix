[project]
name = "xenix-ml-backend"
version = "2.0.0"
description = "Pure Python ML backend for Xenix - performs machine learning operations through stdio and file system"
authors = [
    {name = "Lanzhijiang", email = "lanzhijiang@foxmail.com"},
]
dependencies = [
    "pandas>=2.3.3",
    "numpy>=1.26.0",
    "openpyxl>=3.1.5",
    "scikit-learn>=1.8.0",
    "xgboost>=2.1.3",
    "lightgbm>=4.6.0",
    "joblib>=1.4.2",
    "pydantic>=2.12.5",
    "psycopg2-binary>=2.9.10",
    "fastapi>=0.128.0",
    "uvicorn>=0.40.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = {text = "MIT"}

[tool.pdm]
distribution = false

