[project]
name = "xenix-native"
version = "0.1.0"
description = "PySide6 desktop bootstrap for Xenix"
authors = [
    { name = "Xenix Contributors" },
]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6>=6.9.0",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.0",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python scripts/run_dev.py"
test = "pytest"
check = "python -m compileall src tests scripts"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
