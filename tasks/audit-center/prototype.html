<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Xenix 审计中心 · 交互草图</title>
<style>
:root{font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#202a36;background:#eef1f4;font-size:14px;line-height:1.6}*{box-sizing:border-box}body{margin:0;padding:24px}button,select,input{font:inherit;color:inherit;border:1px solid #c8d0d8;background:#fff;border-radius:5px;padding:7px 12px}button{cursor:pointer}button:hover{background:#f0f4f8}button:disabled{cursor:default;color:#87929c;background:#f3f4f6}button:focus-visible,select:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #3a76ae;outline-offset:2px}button.active{background:#263c54;color:#fff;border-color:#263c54}a{color:#245f9e}.review{max-width:1180px;margin:0 auto 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}.review p{margin:0;flex:1;min-width:240px;font-size:12px;color:#526476}.window{max-width:1180px;height:740px;max-height:calc(100vh - 115px);min-height:480px;margin:auto;background:white;border:1px solid #c4cdd7;border-radius:9px;box-shadow:0 12px 30px #16315110;display:flex;flex-direction:column;overflow:hidden}header{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid #dce2e8}h1{font-size:21px;margin:0}h2{font-size:23px;margin:0 0 5px}h3{font-size:15px;margin:0 0 7px}p{margin:6px 0 14px}.grow{flex:1}.muted{color:#667789;font-size:12px}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:0;flex:1}.side{display:flex;flex-direction:column;border-right:1px solid #dde3e9;min-height:0;background:#fafbfd}.filters{padding:14px;display:grid;gap:10px}.list{overflow:auto;padding:0 8px;flex:1}.row{width:100%;border:1px solid transparent;background:none;text-align:left;padding:12px;margin:0 0 4px;border-radius:6px}.row[aria-pressed=true]{background:#eaf0f7;border-color:#a2b8d0;color:#193d64}.row strong{display:block;font-weight:600}.row small{display:block;color:#657487;margin-top:3px}.count{padding:12px 16px;font-size:12px;color:#637185}.detail{min-width:0;display:flex;flex-direction:column;overflow:hidden}.heading{padding:20px 24px 12px}.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.badge{padding:2px 8px;border:1px solid #d6dee7;background:#f5f7fa;border-radius:4px;font-size:12px}.tabs{display:flex;gap:4px;border-bottom:1px solid #dce2e8;padding:0 24px}.tabs button{border:0;border-radius:0;border-bottom:3px solid transparent;background:none;padding:10px 8px}.tabs button[aria-selected=true]{border-color:#345e89;color:#244e77;font-weight:600}.content{overflow:auto;padding:20px 24px;flex:1}.note{background:#fff8e8;border-left:3px solid #bea15c;padding:12px 15px;margin-bottom:18px}.section{margin-bottom:22px}.section .label{color:#637487;font-size:12px;margin-bottom:6px}.facts{border:1px solid #dbe2e9;border-radius:6px;padding:15px;margin:14px 0}.facts dl{display:grid;grid-template-columns:140px minmax(0,1fr);gap:9px;margin:0}.facts dt{color:#647487}.facts dd{margin:0;overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;padding:13px 24px;border-top:1px solid #dce2e8;background:#fafbfd}.actions .primary{background:#294b6d;color:white;border-color:#294b6d}.empty{padding:35px;color:#67798b}.link{color:#245f9e;background:none;border:0;padding:0;text-decoration:underline}.source{border:1px solid #d8e1eb;border-radius:5px;padding:14px;margin:12px 0}.source button{margin-top:7px}.back{margin-bottom:14px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f9;padding:12px;font-size:12px}summary{cursor:pointer;color:#425c78}#notice{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:6px;background:#263c54;color:#fff;max-width:90vw;z-index:2}#notice:empty{display:none}@media(max-width:900px){body{padding:8px}.window{max-height:none;height:760px}.layout{grid-template-columns:230px minmax(0,1fr)}header{gap:8px;flex-wrap:wrap}.heading,.content{padding:16px}.tabs{padding:0 8px}.actions{padding:12px}.facts dl{grid-template-columns:1fr;gap:2px}.facts dd{margin-bottom:10px}}@media(max-width:600px){.layout{grid-template-columns:180px minmax(0,1fr)}.review p{width:100%}.tabs{flex-wrap:wrap}h2{font-size:19px}}
</style>
<div class="review">
 <button id="auditMode" class="active">审计中心</button><button id="jobsMode">任务中心</button>
 <label>演示状态 <select id="demo"><option value="normal">正常会话</option><option value="none">无当前会话</option><option value="error">读取失败</option></select></label>
 <p>设计草图 · 全部为合成示例，数字不代表真实评估。顶部演示控件不属于产品界面；打开、取消等动作不会操作真实系统。</p>
</div>
<main class="window">
 <header><h1 id="title">审计中心</h1><select id="scope" aria-label="会话范围"><option value="current">当前会话</option><option value="all">所有会话</option></select><span id="context" class="muted">客户流失分析</span><div class="grow"></div><button id="refresh">刷新</button></header>
 <div class="layout"><aside class="side"><div class="filters"><select id="type" aria-label="产出类型"></select><input id="search" placeholder="搜索产出" aria-label="搜索产出"></div><div id="list" class="list" aria-label="产出清单"></div><div id="count" class="count"></div></aside>
 <section class="detail" aria-label="所选对象详情"><div id="heading" class="heading"></div><nav id="tabs" class="tabs" role="tablist" aria-label="详情页"></nav><div id="content" class="content" role="tabpanel"></div><footer id="actions" class="actions"></footer></section></div>
</main><div id="notice" role="status" aria-live="polite"></div>
<script>
const records=[
 {id:'model:201',type:'模型',name:'客户流失模型',time:'10:42',current:true,status:'已完成',explained:true,job:'ml:301',rationale:'希望优先找出下个月可能流失的客户，帮助运营安排回访。选择逻辑回归作为第一轮模型，因为它便于检查每个因素与风险的关系，并为后续复杂模型提供比较基准。限制模型复杂度，是为了降低模型记住这批样本偶然特征的风险。',interpretation:'在预留的历史样本中，模型区分高低风险客户的能力优于简单基线。这支持用它安排试点回访的优先顺序，但还不足以承诺能够挽回多少客户。建议先检查高风险名单，再对一小部分客户开展试点。',limit:'这是历史数据上的评估，不证明因果关系，也不保证下个月效果相同。正式保存的模型用全部可用记录重新训练，下面的分数来自单独保留样本的评估模型。'},
 {id:'dataset:101',type:'数据集',name:'清洗后客户表',time:'10:39',current:true,status:'已完成',explained:true,job:null,rationale:'将客户明细与近三个月订单按客户编号连接，供后续风险分析使用。删除重复客户记录，防止同一个客户被重复计数；没有订单的客户仍保留，避免只分析已经购买的人。',interpretation:'清洗后保留了 1,200 位客户。缺少联系方式的记录仍可参与整体分析，但不能直接用于回访名单。',limit:'空订单表示“未找到匹配订单”，不一定意味着客户从未购买，需要核对订单覆盖时间。'},
 {id:'artifact:401',type:'图表',name:'不同客户群的流失率',time:'10:45',current:true,status:'已完成',explained:true,job:null,rationale:'用柱状图比较客户群的流失比例，而不是流失人数，减少不同群体规模造成的误导。按流失率排序，帮助优先识别值得进一步调查的群体。',interpretation:'图中“新客户”群体的历史流失比例较高，可优先检查其首次购买后的体验。该差异只是关联，不能说明群体身份导致流失。',limit:'只显示样本量最大的 20 个客户群，其他群体未绘入；样本很小的群体即使比例高也不宜直接下结论。'},
 {id:'artifact:402',type:'报告',name:'模型评估报告',time:'10:43',current:true,status:'已完成',explained:true,job:'ml:302',rationale:'使用与训练分开的客户样本评估模型，并与简单基线比较，以检查模型是否只是记住训练记录。',interpretation:'模型在本次样本中的排序能力优于基线；请结合误报和漏报的业务成本再决定回访阈值。',limit:'指标来自一次历史划分；群体或时间分布变化可能影响效果。'},
 {id:'dataset:102',type:'应用结果',name:'下月客户风险名单',time:'10:48',current:true,status:'已完成',explained:false,job:'ml:303',rationale:'把已保留的模型应用到本月客户信息，生成风险排序，作为运营回访的候选名单。不会把预测当成已经发生的流失事实。',limit:'结果已经生成，Agent 尚未解读。'},
 {id:'artifact:499',type:'图表',name:'上季度销售概览',time:'昨天',current:false,status:'文件不可用',explained:false,missing:true,legacy:true,rationale:'',limit:'该历史产出未保存 Agent 解释，来源会话已不可用。'}
];
const jobs=[
 {id:'ml:301',type:'模型训练',name:'训练客户流失模型',time:'10:42',current:true,status:'已完成',output:'model:201'},
 {id:'ml:302',type:'评估',name:'评估客户流失模型',time:'10:43',current:true,status:'已完成',output:'artifact:402'},
 {id:'ml:303',type:'模型应用',name:'生成下月客户风险名单',time:'10:48',current:true,status:'已完成',output:'dataset:102'},
 {id:'ml:304',type:'模型训练',name:'比较随机森林候选',time:'10:49',current:true,status:'运行中',output:null},
 {id:'knowledge:305',type:'知识导入',name:'导入产品说明',time:'10:50',current:false,status:'失败',global:true,output:null}
];
let mode='audit',selected='model:201',tab=0,history=[],noticeTimer;
const el=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(s){el('notice').textContent=s;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>el('notice').textContent='',4000)}
function items(){return mode==='audit'?records:jobs}
function setMode(next,ref){mode=next;selected=ref||items()[0].id;tab=0;history=[];el('type').innerHTML='<option value="">'+(mode==='audit'?'全部类型':'所有任务类型')+'</option>'+[...new Set(items().map(x=>x.type))].map(x=>`<option>${esc(x)}</option>`).join('');el('search').value='';render()}
function render(){
 const audit=mode==='audit';el('title').textContent=audit?'审计中心':'任务中心';el('auditMode').classList.toggle('active',audit);el('jobsMode').classList.toggle('active',!audit);el('search').placeholder=audit?'搜索产出':'搜索任务';el('search').setAttribute('aria-label',el('search').placeholder);
 el('context').textContent=el('scope').value==='all'?'包含其他会话、全局与未记录来源':el('demo').value==='none'?'无当前会话':'客户流失分析';
 const noThread=el('demo').value==='none'&&el('scope').value==='current',error=el('demo').value==='error';
 let visible=noThread||error?[]:items().filter(x=>(el('scope').value==='all'||x.current)&&(!el('type').value||x.type===el('type').value)&&(x.name+x.id).toLowerCase().includes(el('search').value.toLowerCase()));
 if(!history.length&&!visible.some(x=>x.id===selected))selected=visible[0]?.id||null;
 el('list').innerHTML=visible.map(x=>`<button class="row" data-select="${x.id}" aria-pressed="${selected===x.id}"><strong>${esc(x.name)}</strong><small>${esc(x.type)} · ${esc(x.time)}</small><small>${audit?(x.legacy?'历史记录':x.explained?'已有结果解读':'尚无结果解读'):esc(x.status)+' · '+(x.global?'全局':x.current?'当前会话':'来源未记录')}</small></button>`).join('');
 el('count').textContent=`${visible.length} ${audit?'个产出':'个任务'} · 合成示例`;
 if(!visible.length){el('heading').innerHTML='';el('tabs').innerHTML='';el('actions').innerHTML='';el('content').innerHTML=`<div class="empty"><h3>${error?'读取失败':noThread?'无当前会话':'没有符合筛选条件的记录'}</h3><p>${error?'请重试，失败不代表没有产出。':noThread?'打开一个会话查看相关产出，或切换到所有会话。':'请调整类型或搜索条件。'}</p><button id="recover">${error?'重试':noThread?'查看所有会话':'清除筛选'}</button></div>`;el('recover').onclick=()=>{if(error)el('demo').value='normal';else if(noThread)el('scope').value='all';else{el('type').value='';el('search').value=''}render()};return}
 const r=items().find(x=>x.id===selected)||visible[0];el('heading').innerHTML=`${history.length?'<button id="back" class="back">← 返回先前产出</button>':''}<h2>${esc(r.name)}</h2><div class="muted">${esc(r.type)} · ${r.global?'全局':r.current?'本会话生成':'历史产出'} · ${esc(r.time)}</div><div class="badges"><span class="badge">${audit?'关联执行':'任务状态'}：${esc(r.status)}</span>${audit?`<span class="badge">${r.legacy?'未保存解释':r.explained?'已有结果解读':'Agent 尚未解读'}</span>`:''}</div>`;
 const tabs=audit?['解释与证据','输入与来源','参数与记录']:['执行概况','日志'];el('tabs').innerHTML=tabs.map((x,i)=>`<button role="tab" aria-selected="${tab===i}" data-tab="${i}">${x}</button>`).join('');
 if(audit)renderAudit(r);else renderJob(r);
 document.querySelectorAll('[data-select]').forEach(b=>b.onclick=()=>{selected=b.dataset.select;history=[];tab=0;render()});document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=Number(b.dataset.tab);render()});if(el('back'))el('back').onclick=()=>{const previous=history.pop();selected=previous.id;tab=previous.tab;render()};
}
function renderAudit(r){
 if(tab===0)el('content').innerHTML=`<section class="section"><div class="label">Agent 提供 · 执行前说明</div><h3>为什么这样做</h3><p>${esc(r.rationale||'此产出未保存方法说明。')}</p></section><section class="section"><div class="label">Agent 提供 · 结果解读</div><h3>结果意味着什么</h3><p>${esc(r.interpretation||(r.legacy?'此产出未保存 Agent 解释。':'结果已生成，Agent 尚未解读。现有执行记录和文件仍可查看。'))}</p></section><div class="note"><strong>需要留意</strong><p>${esc(r.limit)}</p></div>${r.id==='model:201'?'<div class="facts"><h3>对应执行记录 · 合成示例</h3><dl><dt>评估范围</dt><dd>按客户分组的保留样本</dd><dt>AUC / 基线</dt><dd>0.76 / 0.62（衡量风险排序能力）</dd><dt>最终模型</dt><dd>在全部可用记录上重新训练</dd></dl><button id="evidence" style="margin-top:12px">查看对应评估报告 →</button></div>':''}`;
 if(tab===1)el('content').innerHTML=`<h3>输入与生成来源</h3><p class="muted">按输入逐级查看，不扩大左侧当前会话清单。</p>${r.legacy?'<div class="note">来源未记录，无法推断。</div>':r.id==='dataset:101'?'<div class="source">客户明细 · 输入别名 customers</div><div class="source">近三个月订单 · 输入别名 orders<br><span class="muted">按客户编号连接，保留没有匹配订单的客户。</span></div>':`<div class="source">训练/分析数据：清洗后客户表<br><button id="upstream">查看这个输入 →</button></div>`}<div class="facts">生成记录：${esc(r.id)}<br>来源会话：${r.legacy?'已不可用':'客户流失分析'}</div>`;
 if(tab===2)el('content').innerHTML=r.legacy?'<div class="note">实际执行配置未保存，不使用当前默认值补写。</div>':`<h3>配置与原始记录</h3><p>区分提交的选择和真正执行的值；未记录的内容会明确标示。</p><div class="facts"><dl><dt>提交配置</dt><dd>${r.type==='模型'?'正则化强度 C = 1，控制模型复杂度':r.type==='图表'?'按客户群汇总流失比例，按比例排序':'见操作记录'}</dd><dt>实际配置</dt><dd>${r.type==='模型'?'C = 1；服务解析的迭代次数上限 = 1,000':r.type==='图表'?'最多显示 20 个群体；宽度 640':'见服务保存的执行记录'}</dd><dt>调参选中值</dt><dd>本例未调参</dd></dl></div><details><summary>查看完整记录（合成示例）</summary><pre>${esc(JSON.stringify({object:r.id,recorded:true,note:'原型中的占位执行记录'},null,2))}</pre></details>`;
 el('actions').innerHTML=`<button id="open" class="primary" ${r.missing?'disabled':''}>打开产物</button><button id="job" ${r.job?'':'disabled'}>查看任务</button><button id="thread" ${r.legacy?'disabled':''}>来源会话</button>${r.missing?'<span class="muted">产物文件不可用，记录仍可查看</span>':''}`;
 el('open').onclick=()=>notify('原型演示：生产实现将通过注册的 Artifact 打开产物。');el('job').onclick=()=>setMode('jobs',r.job);el('thread').onclick=()=>notify('原型演示：仅此动作会打开来源会话。');
 const go=id=>{history.push({id:selected,tab});selected=id;tab=0;render()};if(el('evidence'))el('evidence').onclick=()=>go('artifact:402');if(el('upstream'))el('upstream').onclick=()=>go('dataset:101');
}
function renderJob(r){
 el('content').innerHTML=tab===1?`<h3>任务日志</h3><p class="muted">按需读取，不把日志当成结果解释。</p><pre>${r.status==='失败'?'10:50 文件读取失败：格式不受支持。':'10:41 任务已接收\n10:42 执行阶段已开始\n'+(r.status==='运行中'?'10:49 正在训练候选模型':'10:48 结果已登记')}</pre>`:`<h3>执行概况</h3><div class="facts"><dl><dt>任务身份</dt><dd>${esc(r.id)}</dd><dt>来源</dt><dd>${r.global?'全局 Knowledge Workspace':'客户流失分析'}</dd><dt>状态</dt><dd>${esc(r.status)}</dd><dt>结束时间</dt><dd>${r.status==='运行中'?'尚未结束':esc(r.time)}</dd></dl></div>${r.status==='失败'?'<div class="note">格式不受支持。请检查源文件后重新导入。</div>':''}<p>${r.output?'已有产出，可在审计中心查看来源和 Agent 解释。':'尚无已登记的产出。'}</p><p class="muted">任务执行状态与 Agent 解释状态分别记录。</p>`;
 el('actions').innerHTML=`<button id="output" class="primary" ${r.output?'':'disabled'}>查看关联产出</button><button id="cancel" ${r.status==='运行中'?'':'disabled'}>取消任务</button>`;el('output').onclick=()=>setMode('audit',r.output);el('cancel').onclick=()=>notify('原型演示：生产实现会向调度器请求取消，不将点击直接当成取消成功。');
}
el('auditMode').onclick=()=>setMode('audit');el('jobsMode').onclick=()=>setMode('jobs');['scope','type','demo'].forEach(id=>el(id).onchange=()=>{history=[];render()});el('search').oninput=()=>{history=[];render()};el('refresh').onclick=()=>{render();notify('合成数据已刷新；当前选择保持。')};setMode('audit');
</script>
</html>
