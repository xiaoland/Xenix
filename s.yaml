edition: 3.0.0
name: xenix-app
access: default # Run 's config add' to configure Aliyun credentials

vars:
  region: cn-hangzhou
  serviceName: xenix

resources:
  # Node.js dependencies layer for backend
  xenix-backend-nodejs-layer:
    component: fc3
    actions:
      pre-deploy:
        - run: |
            mkdir -p opt/nodejs/bin

            # Download and extract Node.js 20 for the layer
            if [ ! -d "node-v20.18.1-linux-x64" ]; then
              wget -q https://nodejs.org/dist/v20.18.1/node-v20.18.1-linux-x64.tar.xz
              tar -xf node-v20.18.1-linux-x64.tar.xz
            fi

            # Copy Node.js binaries to layer
            cp -r node-v20.18.1-linux-x64/bin/* opt/nodejs/bin/
            cp -r node-v20.18.1-linux-x64/lib opt/nodejs/
            cp -r node-v20.18.1-linux-x64/include opt/nodejs/

            # Install production dependencies
            cp package.json opt/nodejs/
            cd opt/nodejs
            npm install --production --omit=dev
            rm package.json

            # Clean up
            cd ../..
            rm -rf node-v20.18.1-linux-x64.tar.xz
          path: ./packages/backend
    props:
      region: ${vars.region}
      layerName: xenix-backend-nodejs-deps
      description: Node.js dependencies for Xenix backend
      compatibleRuntime: [nodejs18, nodejs20, custom.debian10]
      code: ./packages/backend/opt

  # Python dependencies layer for ML backend
  xenix-ml-python-layer:
    component: fc3
    actions:
      pre-deploy:
        - run: |
            pip install pdm
            pdm export --prod --format requirements --output requirements.txt
            mkdir -p python
            pip install -r requirements.txt -t python/
          path: ./packages/ml-backend
    props:
      region: ${vars.region}
      layerName: xenix-ml-python-deps
      description: Python ML dependencies (pandas, sklearn, xgboost, lightgbm, etc.)
      compatibleRuntime: [python3.9, python3.10, python3.12]
      code: ./packages/ml-backend/python

  # Main HTTP Backend (Node.js)
  xenix-backend:
    component: fc3
    actions:
      pre-deploy:
        - run: pnpm run build
          path: ./packages/backend
    props:
      region: ${vars.region}
      functionName: xenix-backend
      description: Xenix main HTTP backend (Node.js HTTP server)
      runtime: custom.debian10
      memorySize: 512
      timeout: 60
      code: ./packages/backend
      layers:
        - ${resources.xenix-backend-nodejs-layer.output.arn}
      customRuntimeConfig:
        command:
          - bash
        args:
          - fc-start.sh
      environmentVariables:
        NODE_ENV: production
        BACKEND_PORT: "9000"
        STORAGE_TYPE: oss
        OSS_REGION: ${env.OSS_REGION}
        OSS_ACCESS_KEY_ID: ${env.OSS_ACCESS_KEY_ID}
        OSS_ACCESS_KEY_SECRET: ${env.OSS_ACCESS_KEY_SECRET}
        OSS_BUCKET: ${env.OSS_BUCKET}
        OSS_ENDPOINT: ${env.OSS_ENDPOINT}
        DATABASE_URL: ${env.DATABASE_URL}
        JWT_SECRET: ${env.JWT_SECRET}
        ML_TIMEOUT: "300000"
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
            authType: anonymous
          triggerName: httpTrigger
          triggerType: http

  # ML Backend (Python)
  xenix-ml-backend:
    component: fc3
    props:
      region: ${vars.region}
      functionName: xenix-ml-backend
      description: ML backend for training and prediction
      runtime: python3.12
      memorySize: 4096
      timeout: 600
      code: ./packages/ml-backend
      layers:
        - ${resources.xenix-ml-python-layer.output.arn}
      environmentVariables:
        PYTHONPATH: /opt/python:/code
        ML_BASE_PATH: /tmp/ml-backend
        LOG_LEVEL: INFO
        OSS_REGION: ${env.OSS_REGION}
        OSS_ACCESS_KEY_ID: ${env.OSS_ACCESS_KEY_ID}
        OSS_ACCESS_KEY_SECRET: ${env.OSS_ACCESS_KEY_SECRET}
        OSS_BUCKET: ${env.OSS_BUCKET}
        OSS_ENDPOINT: ${env.OSS_ENDPOINT}
