edition: 3.0.0
name: xenix-app
access: default # Run 's config add' to configure Aliyun credentials

vars:
  region: cn-hangzhou
  serviceName: xenix
  # Official public layer ARNs for Aliyun FC
  nodejs22LayerArn: acs:fc:${vars.region}:official:layers/Nodejs22/versions/1
  python312LayerArn: acs:fc:${vars.region}:official:layers/Python312/versions/1

resources:
  # Node.js dependencies layer for backend (production node_modules only)
  xenix-backend-nodejs-deps-layer:
    component: fc3
    actions:
      pre-deploy:
        - run: bash build-layer.sh
          path: ./packages/backend
    props:
      region: ${vars.region}
      layerName: xenix-backend-nodejs-deps
      description: Node.js production dependencies for Xenix backend
      compatibleRuntime: [nodejs18, nodejs20, nodejs22, custom, custom.debian11]
      code: ./packages/backend/opt

  # Main HTTP Backend (Node.js)
  xenix-backend:
    component: fc3
    actions:
      pre-deploy:
        - run: pnpm run build
          path: ./packages/backend
    props:
      region: ${vars.region}
      functionName: xenix-backend
      description: Xenix main HTTP backend (Node.js HTTP server with custom runtime)
      runtime: custom.debian11
      memorySize: 512
      timeout: 60
      code: ./packages/backend
      layers:
        - ${vars.nodejs22LayerArn}
        - ${resources.xenix-backend-nodejs-deps-layer.output.arn}
      customRuntimeConfig:
        command:
          - bash
        args:
          - fc-start.sh
      environmentVariables:
        NODE_ENV: production
        BACKEND_PORT: "9000"
        STORAGE_TYPE: oss
        OSS_REGION: ${env.OSS_REGION}
        OSS_ACCESS_KEY_ID: ${env.OSS_ACCESS_KEY_ID}
        OSS_ACCESS_KEY_SECRET: ${env.OSS_ACCESS_KEY_SECRET}
        OSS_BUCKET: ${env.OSS_BUCKET}
        OSS_ENDPOINT: ${env.OSS_ENDPOINT}
        DATABASE_URL: ${env.DATABASE_URL}
        JWT_SECRET: ${env.JWT_SECRET}
      triggers:
        - triggerConfig:
            methods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
            authType: anonymous
          triggerName: httpTrigger
          triggerType: http

  # ML Backend (Python)
  xenix-ml-backend:
    component: fc3
    actions:
      pre-deploy:
        - run: bash build-deps.sh
          path: ./packages/ml-backend
    props:
      region: ${vars.region}
      functionName: xenix-ml-backend
      description: ML backend for training and prediction
      runtime: python3.12
      memorySize: 4096
      timeout: 86400
      code: ./packages/ml-backend
      layers:
        - ${vars.python312LayerArn}
      environmentVariables:
        PYTHONPATH: /opt/python:/code
        ML_BASE_PATH: /tmp/ml-backend
        LOG_LEVEL: INFO
        OSS_REGION: ${env.OSS_REGION}
        OSS_ACCESS_KEY_ID: ${env.OSS_ACCESS_KEY_ID}
        OSS_ACCESS_KEY_SECRET: ${env.OSS_ACCESS_KEY_SECRET}
        OSS_BUCKET: ${env.OSS_BUCKET}
        OSS_ENDPOINT: ${env.OSS_ENDPOINT}
