<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
  <title id="title">Xenix Native — 你的桌面 Data Agent</title>
  <desc id="desc">橙黑品牌横幅。Xenix 是能调用工具、执行数据分析与机器学习任务的桌面 Data Agent。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15151b"/><stop offset="1" stop-color="#26202a"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ed6609" stop-opacity=".24"/><stop offset="1" stop-color="#ed6609" stop-opacity="0"/></radialGradient>
    <linearGradient id="accent"><stop stop-color="#ffb16b"/><stop offset="1" stop-color="#ed6609"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="440" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="24" fill="url(#grid)"/>
  <ellipse cx="1090" cy="180" rx="360" ry="330" fill="url(#glow)"/>
  <rect x="64" y="57" width="32" height="4" rx="2" fill="#ed6609"/>
  <g font-family="Segoe UI, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
    <text x="109" y="65" fill="#e3b38f" font-size="16" letter-spacing="3">数据智能体 · 原生桌面</text>
    <text x="60" y="160" fill="#fff" font-size="74" font-weight="700" letter-spacing="-2">Xenix<tspan dx="18" fill="#ff9a4d" font-weight="300"> Native</tspan></text>
    <text x="64" y="224" fill="#fff" font-size="34" font-weight="600">你的桌面 Data Agent。</text>
    <text x="64" y="270" fill="#b8b5c0" font-size="20">提出业务问题，让 Agent 执行分析、交付成果。</text>
    <g font-size="15" fill="#dad7df">
      <rect x="64" y="324" width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="125" y="349" text-anchor="middle">原生桌面</text>
      <rect x="200" y="324" width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="261" y="349" text-anchor="middle">本地工作区</text>
      <rect x="336" y="324" width="122" height="38" rx="19" fill="#ffffff" fill-opacity=".06" stroke="#ffffff" stroke-opacity=".12"/>
      <text x="397" y="349" text-anchor="middle">可追溯分析</text>
    </g>
  </g>
  <g transform="translate(887 74)">
    <circle cx="142" cy="142" r="164" fill="none" stroke="#ed6609" stroke-opacity=".14"/>
    <circle cx="142" cy="142" r="132" fill="none" stroke="#ffffff" stroke-opacity=".06"/>
    <g transform="translate(0 0) scale(.89)">
      <rect x="251.891" y="29.5" width="56.4855" height="123.273" rx="17" transform="rotate(45 251.891 29.5)" fill="url(#accent)"/>
      <rect x="165.979" y="203.333" width="56.4855" height="123.273" rx="17" transform="rotate(-45 165.979 203.333)" fill="#70616a"/>
      <rect x="114.08" y="162.5" width="56.4855" height="123.273" rx="17" transform="rotate(45 114.08 162.5)" fill="#70616a"/>
      <rect x="27.0796" y="69.5" width="56.4855" height="123.273" rx="17" transform="rotate(-45 27.0796 69.5)" fill="#70616a"/>
    </g>
  </g>
  <path d="M64 406H1216" stroke="#ffffff" stroke-opacity=".09"/>
</svg>
