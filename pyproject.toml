[project]
name = "xenix-native"
version = "1.4.0"
description = "Xenix native"
authors = [{ name = "Lan_zhijiang", email = "lanzhijiang@foxmail.com" }]
readme = "README.md"
requires-python = "==3.14.2"
dependencies = [
    "PySide6>=6.9.0",
    "sqlmodel>=0.0.24",
    "pydantic>=2.11.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "joblib>=1.5.0",
    "scikit-learn>=1.7.0",
    "duckdb>=1.5.2",
    "qtawesome>=1.4.2",
    "xgboost>=3.2.0",
    "lightgbm>=4.6.0",
    "mlxtend>=0.24.0",
    "apyori>=1.1.2",
    "marko>=2.2.0",
    "statsmodels>=0.14.0",
    "vl-convert-python==1.9.0.post1",
    "wordcloud>=1.9.6",
    "jieba>=0.42.1",
    "opentelemetry-api>=1.42.1",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp>=1.42.1",
    "opentelemetry-instrumentation-logging>=0.63b1",
    "structlog>=26.1.0",
    "polars[calamine,rtcompat]==1.42.1",
    "xlsxwriter>=3.2.0",
    "velopack==1.2.0",
    "docling<3,>=2.114.0",
    "firecrawl-anydoc==0.2.4",
    "zstandard<1,>=0.23",
    "charset-normalizer<4,>=3.4",
    "lancedb<1,>=0.34",
    "pikepdf<11,>=10.10",
    "msoffcrypto-tool<7,>=6.0",
    "jsonschema<5,>=4.26",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.16.0",
    "pytest>=8.4.0",
    "PyYAML>=6.0.0",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "types-jsonschema>=4.26.0.20260518",
    "pytest-testmon>=2.2.0",
    "pytest-qt==4.5.0",
]
release = [
    "oss2==2.19.1",
]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
agent-skills-check = "python scripts/agent_skills.py check"
agent-skills-generate = "python scripts/agent_skills.py generate"
knowledge-ocr-lock-check = "python scripts/build_knowledge_ocr_runtime.py --check-lock"
lint = "ruff check src tests scripts"
typecheck = "mypy"
dev = { composite = ["agent-skills-generate", "python scripts/run_dev.py"] }
i18n-extract = "python scripts/update_translations.py"
i18n-compile = "python scripts/compile_translations.py"
package = { composite = ["agent-skills-generate", "agent-skills-check", "python scripts/package_app.py"], env = { PYTHONHASHSEED = "0" } }
build-knowledge-ocr = "python scripts/build_knowledge_ocr_runtime.py"
smoke = { composite = ["agent-skills-generate", "python scripts/run_dev.py --smoke-test"] }
smoke-package = "python scripts/verify_packaged_smoke.py"
velopack = "python scripts/package_velopack.py"
release-manifest = "python scripts/write_release_manifest.py"
release-identity = "python scripts/verify_release_identity.py"
release-controls-audit = "python scripts/audit_release_controls.py"
release-timings = "python scripts/report_native_workflow_timings.py"
release-package = { composite = ["package", "smoke-package", "velopack", "release-manifest"] }
release-build = { composite = ["build-knowledge-ocr", "package", "smoke-package", "velopack", "release-manifest"] }
release-publish = "python scripts/publish_oss_release.py"
dist = "python scripts/build_distribution_zip.py"
pytest = "python scripts/run_pytest.py"
test = { composite = ["i18n-compile", "python scripts/run_pytest.py {args}"] }
test-affected = { cmd = "python scripts/run_pytest.py --testmon {args}", env = { COVERAGE_CORE = "pytrace" } }
list-affected = { cmd = "python scripts/run_pytest.py --testmon --collect-only {args}", env = { COVERAGE_CORE = "pytrace" } }
benchmark-agent-harness = "python scripts/run_agent_harness_benchmark.py"
benchmark-agent-harness-headed = "python scripts/run_agent_harness_headed_benchmark.py"
benchmark-agent-harness-check = "python scripts/check_agent_harness_benchmark.py"
benchmark-agent-harness-evaluate = "python scripts/evaluate_agent_harness_reports.py"
benchmark-agent-harness-calibrate-judge = "python scripts/calibrate_agent_harness_judge.py"
check = { composite = ["agent-skills-generate", "agent-skills-check", "lint", "typecheck", "knowledge-ocr-lock-check", "python -m compileall src tests scripts"] }
diagnostic-bundle = "python scripts/create_diagnostic_bundle.py"
ui-lab = { cmd = "python -m scripts.ui_lab", env = { PYTHONPATH = "src" } }
ui-capture = { cmd = "python -m scripts.ui_lab.capture_cli", env = { PYTHONPATH = "src" } }
ui-capture-all = { cmd = "python -m scripts.ui_lab.capture_all", env = { PYTHONPATH = "src" } }
ui-native-smoke = { cmd = "python scripts/run_pytest.py --direct tests/ui_native/native_window_smoke.py -q", env = { QT_QPA_PLATFORM = "windows" } }
ui-artifacts-index = "python -m scripts.ui_lab.artifact_index --root ui-artifacts"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
qt_api = "pyside6"
markers = [
    "agent_harness_live: explicit real-provider Agent Harness benchmark case",
]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["src"]
extend-exclude = ["/ml", "/tasks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "A"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
"scripts/package_app.py" = ["E402"]
"scripts/run_packaged.py" = ["E402"]
"scripts/ui_lab/capture_cli.py" = ["E402"]

[tool.mypy]
python_version = "3.14"
platform = "win32"
mypy_path = "src"
files = [
    "src/xenix/application_services.py",
    "src/xenix/ui/history/panel.py",
    "src/xenix/ui/windows/auxiliary.py",
    "src/xenix/ui/settings/contracts.py",
    "src/xenix/ui/settings/provider.py",
    "src/xenix/ui/settings/ocr.py",
    "src/xenix/ui/ocr_deployment_tasks.py",
    "src/xenix/ui/conversation/turn_controller.py",
    "src/xenix/ui/conversation/execution.py",
    "scripts/ui_lab/__main__.py",
    "scripts/ui_lab/artifact_index.py",
    "scripts/ui_lab/capture_all.py",
    "scripts/ui_lab/capture_cli.py",
    "scripts/ui_lab/contracts.py",
    "scripts/ui_lab/driver.py",
    "scripts/ui_lab/feature_scenarios.py",
    "scripts/ui_lab/gallery.py",
    "scripts/ui_lab/registry.py",
    "scripts/ui_lab/scenarios.py",
    "scripts/build_knowledge_ocr_runtime.py",
    "src/xenix/release_config.py",
    "src/xenix/runtime_profile.py",
    "src/xenix/trial_lock.py",
    "src/xenix/services/agent/knowledge_tool.py",
    "src/xenix/services/agent/skill_catalog.py",
    "src/xenix/services/agent/tool_inputs.py",
    "src/xenix/services/data_tokenization_contracts.py",
    "src/xenix/services/knowledge_content_store.py",
    "src/xenix/services/knowledge_document_lifecycle_service.py",
    "src/xenix/services/knowledge_formats.py",
    "src/xenix/services/knowledge_import_worker.py",
    "src/xenix/services/llm/tooling.py",
    "src/xenix/services/ml/contracts.py",
    "src/xenix/services/ml/registry.py",
    "src/xenix/services/ml/types.py",
    "src/xenix/services/ml/worker_settings.py",
    "src/xenix/services/ml/trained_model_metadata.py",
    "src/xenix/ui/semantic_identity.py",
    "src/xenix/ui/diagnostics/capture.py",
    "src/xenix/ui/diagnostics/schema.py",
    "src/xenix/ui/diagnostics/snapshot.py",
    "src/xenix/ui/layout_debug.py",
]
plugins = ["pydantic.mypy"]
follow_imports = "silent"
strict = true
show_error_codes = true
pretty = true
warn_unused_configs = true

[tool.pydantic-mypy]
init_typed = true
warn_required_dynamic_aliases = true
