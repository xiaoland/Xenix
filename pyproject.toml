[project]
name = "xenix-native"
version = "1.0.0"
description = "Xenix native"
authors = [{ name = "Lan_zhijiang", email = "lanzhijiang@foxmail.com" }]
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6>=6.9.0",
    "sqlmodel>=0.0.24",
    "pydantic>=2.11.0",
    "pandas>=2.3.0",
    "openpyxl>=3.1.0",
    "joblib>=1.5.0",
    "scikit-learn>=1.7.0",
]

[dependency-groups]
dev = ["pyinstaller>=6.16.0", "pytest>=8.4.0"]

[tool.pdm]
distribution = false

[tool.pdm.scripts]
dev = "python scripts/run_dev.py"
test = "pytest"
check = "python -m compileall src tests scripts"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
